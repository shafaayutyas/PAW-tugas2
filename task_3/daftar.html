<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Halaman Pendaftaran</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h2>Form Pendaftaran</h2>
        <p class="subtitle">Silakan lengkapi data pendaftaran berikut.</p>

        <form method="get" action="detail.html">

            <!-- DATA DIRI -->
            <fieldset>
                <legend>Data Diri</legend>

                <p>
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" name="nama"
                           placeholder="Masukkan nama lengkap" required>
                </p>

                <p>
                    <label for="nim">NIM</label>
                    <input type="text" id="nim" name="nim"
                           placeholder="Masukkan NIM" required>
                </p>

                <p>
                    <label>Jenis Kelamin</label>

                    <span class="radio-group">
                        <input type="radio" id="male" name="gender" value="male" required>
                        <label for="male">Laki-laki</label>

                        <input type="radio" id="female" name="gender" value="female">
                        <label for="female">Perempuan</label>
                    </span>
                </p>

                <p>
                    <label for="tanggalLahir">Tanggal Lahir</label>
                    <input type="date" id="tanggalLahir" name="tanggalLahir" required>
                </p>

                <p>
                    <label for="email">Email ITERA</label>
                    <input type="email" id="email" name="email"
                           placeholder="contoh@gmail.com" required>
                </p>

            </fieldset>


            <!-- DATA AKADEMIK -->
            <fieldset>
                <legend>Data Akademik</legend>

                <p>
                    <label for="universitas">Universitas</label>
                    <select id="universitas" name="universitas" required>
                        <option value="">Pilih Universitas</option>
                        <option value="Institut Teknologi Sumatera">
                            Institut Teknologi Sumatera
                        </option>
                    </select>
                </p>

                <p>
                    <label for="fakultas">Fakultas</label>
                    <select id="fakultas" name="fakultas" required>
                        <option value="">Pilih Fakultas</option>
                        <option value="Fakultas Teknologi Infrastruktur dan Kewilayahan">
                            Fakultas Teknologi Infrastruktur dan Kewilayahan
                        </option>
                        <option value="Fakultas Teknologi Industri">
                            Fakultas Teknologi Industri
                        </option>
                        <option value="Fakultas Sains">
                            Fakultas Sains
                        </option>
                    </select>
                </p>

                <p>
                    <label for="prodi">Program Studi</label>
                    <input type="text" id="prodi" name="prodi"
                           placeholder="Contoh: Teknik Informatika" required>
                </p>

                <p>
                    <label for="semester">Semester</label>
                    <select id="semester" name="semester" required>
                        <option value="">Pilih Semester</option>
                        <option value="1/2">1/2</option>
                        <option value="3/4">3/4</option>
                        <option value="5/6">5/6</option>
                        <option value="7/8">7/8</option>
                    </select>
                </p>

            </fieldset>


            <!-- DOKUMEN -->
            <fieldset>
                <legend>Dokumen Pendukung</legend>

                <p>
                    <label for="foto">Upload Foto</label>
                    <input type="file" id="foto" name="foto">
                </p>

                <p>
                    <label for="cv">Upload CV</label>
                    <input type="file" id="cv" name="cv">
                </p>

            </fieldset>

            <button type="submit">Daftar</button>

        </form>

    </div>

</body>
</html>
